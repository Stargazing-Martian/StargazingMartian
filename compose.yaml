services:
  ctod:
    build:
      context: ./ctod
      dockerfile: Dockerfile
    environment:
      CTOD_PORT: "5000"
      CTOD_DATASET_CONFIG_PATH: /app/config/datasets.json
      CTOD_TILE_CACHE_PATH: /app/cache
      CTOD_MARS_DEM: /data/MarsHRSCMOLA_MAP2_COG.tif
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_CONNECTTIMEOUT: "10"
      GDAL_HTTP_TIMEOUT: "20"
      GDAL_HTTP_MAX_RETRY: "2"
      GDAL_HTTP_RETRY_DELAY: "1"
      CTOD_CORS_ALLOW_ORIGIN_REGEX: "^https?://(?:localhost|127\\.0\\.0\\.1|\\[::1\\]|[a-z0-9-]+-[0-9]+\\.app\\.github\\.dev)(?::[0-9]+)?$"
    ports:
      - "5000:5000"
    volumes:
      - ./ctod:/app
      - ctod-cache:/app/cache
      - ${STARGAZING_DEM_DIR:-./ctod/data}:/data:ro
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      - ctod
    ports:
      - "5500:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  ctod-cache:
